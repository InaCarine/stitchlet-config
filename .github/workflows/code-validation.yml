name: Code validation

on:
  pull_request:
    branches: ["*"]

jobs:
  format-check:
    runs-on: ubuntu-latest
    name: Check formatting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check
